<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<!-- Login Overlay -->
<div id="loginOverlay" style="
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;">
    <div style="
        background:white; padding:40px; border-radius:16px;
        text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.4);
        width:350px;">
        <h2 style="color:#1a1a2e;">🎓 Student Result System</h2>
        <p style="color:#666;">Enter password to continue</p>
        <input type="password" id="pwdInput"
            class="form-control mb-3"
            placeholder="Enter password"
            onkeypress="if(event.key==='Enter') checkPassword()">
        <button class="btn btn-dark w-100" onclick="checkPassword()">
            🔐 Login
        </button>
        <div id="pwdError" class="mt-2 text-danger fw-bold"></div>
    </div>
</div>
<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">🎓 Student Result System</span>
    <div>
        <button class="btn btn-outline-light btn-sm me-2" onclick="showSection('add')">Add Student</button>
        <button class="btn btn-outline-light btn-sm me-2" onclick="showSection('view')">View All</button>
        <button class="btn btn-outline-light btn-sm me-2" onclick="showSection('search')">Search</button>
        <button class="btn btn-outline-light btn-sm" onclick="showSection('update')">Update</button>
    </div>
</nav>

<!-- Dashboard -->
<div class="container mt-4" id="dashboard">
    <h4 class="mb-4 text-center">📊 Dashboard</h4>
    <div class="row text-center">
        <div class="col-md-3">
            <div class="card bg-primary text-white p-3">
                <h5>Total Students</h5>
                <h2 id="totalCount">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white p-3">
                <h5>Passed</h5>
                <h2 id="passCount">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white p-3">
                <h5>Failed</h5>
                <h2 id="failCount">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-white p-3">
                <h5>Average Marks</h5>
                <h2 id="avgMarks">0</h2>
            </div>
        </div>
    </div>
</div>

<!-- Add Student -->
<div class="container mt-4 section" id="add" style="display:none;">
    <div class="card p-4 mx-auto" style="max-width:500px;">
        <h5 class="mb-3">➕ Add Student</h5>
        <input type="number" id="addId" class="form-control mb-2" placeholder="Student ID">
        <input type="text" id="addName" class="form-control mb-2" placeholder="Name">
        <input type="text" id="addDept" class="form-control mb-2" placeholder="Department">
        <input type="number" id="addMarks" class="form-control mb-3" placeholder="Marks (0-100)" min="0" max="100">
        <button class="btn btn-primary w-100" onclick="addStudent()">Add Student</button>
        <div id="addMsg" class="mt-2 text-center fw-bold"></div>
    </div>
</div>

<!-- View All -->
<div class="container mt-4 section" id="view" style="display:none;">
    <h5>📋 All Students</h5>
    <button class="btn btn-success btn-sm mb-3" onclick="loadStudents()">🔄 Refresh</button>
    <button class="btn btn-danger btn-sm mb-3 ms-2" onclick="exportPDF()">📄 Export PDF</button>
    <button class="btn btn-secondary btn-sm mb-3 ms-2" onclick="printReport()">🖨️ Print Report</button>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Name</th><th>Department</th><th>Marks</th><th>Grade</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>

<!-- Search -->
<div class="container mt-4 section" id="search" style="display:none;">
    <div class="card p-4 mx-auto" style="max-width:500px;">
        <h5 class="mb-3">🔍 Search Student</h5>
        <input type="number" id="searchId" class="form-control mb-2" placeholder="Search by ID">
        <input type="text" id="searchName" class="form-control mb-2" placeholder="Search by Name">
        <button class="btn btn-info w-100 text-white" onclick="searchStudent()">Search</button>
        <div id="searchResult" class="mt-3"></div>
    </div>
</div>
<!-- Update -->
<div class="container mt-4 section" id="update" style="display:none;">
    <div class="card p-4 mx-auto" style="max-width:500px;">
        <h5 class="mb-3">✏️ Update Marks</h5>
        <input type="number" id="updateId" class="form-control mb-2" placeholder="Student ID">
        <input type="number" id="updateMarks" class="form-control mb-3" placeholder="New Marks">
        <button class="btn btn-warning w-100" onclick="updateMarks()">Update</button>
        <div id="updateMsg" class="mt-2 text-center fw-bold"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
